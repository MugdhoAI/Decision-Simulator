[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-simulator"
version = "0.2.0"
description = "A CLI decision support tool that stress-tests choices through simulated future selves."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
decision-simulator = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
